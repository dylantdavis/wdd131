<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RecipeBook</title>
  <meta name="description" content="Find and save your favorite recipes.">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="RecipeBook">
  <meta property="og:description" content="Find and save your favorite recipes.">
  <meta property="og:url" content="https://yoursite.com/">
  <meta property="og:image" content="https://yoursite.com/images/social-preview-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- X Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="RecipeBook">
  <meta name="twitter:description" content="Find and save your favorite recipes.">
  <meta name="twitter:image" content="https://yoursite.com/images/social-preview-image.png">

  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

  <!-- Amatic SC headline font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="recipe.css">
  <script src="recipe.js" defer></script>
</head>
<body>
  <div class="page">

    <!-- Logo and title -->
    <header class="site-header">
      <img src="images/recipe-book.png" alt="" class="logo">
      <h1>RecipeBook</h1>
    </header>

    <!-- Search area -->
    <div class="search-area">
      <form action="/search" method="get" role="search" class="search-box">
        <label for="site-search" class="visually-hidden">Find a recipe</label>
        <input type="search" id="site-search" name="q" placeholder="Find a recipe">
        <button type="submit">
          <img src="images/search.svg" alt="Search">
        </button>
      </form>
    </div>

    <!-- Recipe -->
    <main>
      <article class="recipe-card">
        <img src="images/apple-crisp.jpg" alt="A bowl of apple crisp topped with vanilla ice cream" class="recipe-image">
        <div class="recipe-info">
          <span class="tag">dessert</span>
          <h2>Apple Crisp</h2>
          <span class="rating" role="img" aria-label="Rating: 4 out of 5 stars">
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star-empty">☆</span>
          </span>
          <p class="description">
            This apple crisp recipe is a simple yet delicious fall dessert that’s great served warm with vanilla ice cream.
          </p>
        </div>
      </article>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
      <div class="social">
        <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates -->
        <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
        <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
        <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
      </div>
      <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
    </footer>

  </div>
</body>
</html>
