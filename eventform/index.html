<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Ticket Form</title>
    <link rel="stylesheet" href="form.css">
    <script src="form.js" defer></script>
</head>

<body>
    <main id="ticket-form">
        <div class="card">
            <h1>Event Ticket</h1>

            <form class="signup-form" novalidate>
                <div class="field">
                    <label for="first-name">First Name</label>
                    <input type="text" id="first-name" name="first-name" autocomplete="given-name" required>
                </div>

                <div class="field">
                    <label for="last-name">Last Name</label>
                    <input type="text" id="last-name" name="last-name" autocomplete="family-name" required>
                </div>

                <div class="field full">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>

                <div class="field">
                    <label for="type">Type</label>
                    <select id="type" name="type" required>
                        <option value="">Choose one</option>
                        <option value="student">Student</option>
                        <option value="guest">Guest</option>
                    </select>
                </div>

                <div class="field">
                    <label for="event-date">Event Date</label>
                    <input type="date" id="event-date" name="event-date" required>
                </div>

                <div class="field full" id="extra-field" hidden>
                    <label for="extra-input" id="extra-label"></label>
                    <input type="text" id="extra-input" name="extra-input">
                </div>

                <button type="submit" class="full">Create Ticket</button>
            </form>

            <p id="form-error" class="error"></p>

            <div id="ticket" hidden>
                <h2>Ticket Created</h2>
                <p id="ticket-name"></p>
                <p id="ticket-type"></p>
                <p id="ticket-date"></p>
            </div>
        </div>
    </main>
</body>

</html>
